# Глобальная часть nginx для платформы: под работает от 65532 с корневой
# файловой системой только на чтение. Все временные пути — в /tmp,
# единственном каталоге, который платформа монтирует записываемым.
# Образец — psy/stranica-demo.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {
    worker_connections 1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;
    include /etc/nginx/conf.d/*.conf;
}
