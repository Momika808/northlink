server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Журнал обращений не пишем: страница выдаёт ключи, а кто и когда её
    # открыл, нам знать незачем (identity.md §6). Адрес человека сюда всё
    # равно не доходит — только адрес фронта.
    access_log off;

    # На этом origin страница держит жетоны входа (localStorage), поэтому:
    # чужой сайт не встраивает её во фрейм (подставить кнопки под клик), а
    # браузер не угадывает тип ответа. frame-ancestors мета-тегом CSP не
    # задать — только заголовком. В location со своим add_header общие
    # заголовки не наследуются, поэтому ниже они повторены.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Проба платформы: отдельный путь, чтобы не трогать страницу.
    location = /zdorov {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Страницы без кэша: правка на сайте должна доходить сразу, а старый
    # скрипт с новым CSP (или наоборот) браузер молча не исполнит.
    location ~ \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
